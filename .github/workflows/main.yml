name: Atualizar Radar Web

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-dados:
    runs-on: ubuntu-latest
    steps:
      - name: Puxar os arquivos
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar as dependências
        run: pip install -r requirements.txt

      - name: Executar o Robô
        run: python radar_chapeco.py

      - name: Salvar os dados no Site
        run: |
          git config --global user.name "Radar Bot"
          git config --global user.email "bot@radar.com"
          git add base_radar.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Atualiza banco de dados de imóveis" && git push)
